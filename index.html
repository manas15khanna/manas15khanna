<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manas Khanna — AI &amp; Retrieval Systems • Linux &amp; Cybersecurity</title>
    <meta
      name="description"
      content="Portfolio of Manas Khanna — Software Engineer, AI & Retrieval Systems, Cloud Computing, Linux (Omarchy/Hyprland), and Cybersecurity."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#050608] text-[#F4F5F7] antialiased selection:bg-[var(--accent-active)] selection:text-[#050608]">
    <!-- Global SVG Filters for Liquid Distortion -->
    <svg class="pointer-events-none fixed h-0 w-0 opacity-0" aria-hidden="true">
      <defs>
        <filter id="liquid-goo">
          <feTurbulence
            id="liquid-turbulence"
            type="fractalNoise"
            baseFrequency="0.015 0.04"
            numOctaves="2"
            seed="3"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="18"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
